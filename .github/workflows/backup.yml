name: Backup de base de datos

# Por qué corre acá y no en la máquina de nadie: pg_dump tiene que ser >= al
# servidor (Neon corre PostgreSQL 17) y ninguna laptop del equipo tiene cliente
# Postgres instalado. Además, un backup que depende de que alguien se acuerde
# no es un backup.
on:
  schedule:
    # 03:15 UTC = 00:15 en Argentina (UTC-3). Fuera del horario en que un
    # docente podría estar cargando un programa.
    - cron: '15 3 * * *'
  workflow_dispatch:
    inputs:
      keep:
        description: 'Cuántos backups conservar'
        required: false
        default: '30'

# Dos corridas simultáneas se pisarían al podar los backups viejos.
concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    # El default es 6 horas; si el dump se cuelga, mejor enterarse rápido.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # ubuntu-latest trae el cliente 16, que se niega a dumpear un servidor 17.
      # El repo PGDG es la forma soportada de conseguir el 17.
      - name: Instalar postgresql-client-17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Exportar, cifrar y subir
        env:
          # Endpoint DIRECTO, no el pooler: pg_dump no puede pasar por PgBouncer.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BACKUP_KEEP: ${{ github.event.inputs.keep || '30' }}
        run: npx tsx scripts/backup-export.ts

      # Un backup que falla en silencio es peor que no tenerlo, porque genera
      # confianza. Si el schedule falla, que quede un issue abierto.
      - name: Abrir issue si falló
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'El backup automático de la base falló'
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'backup-failure',
            })
            if (existing.length > 0) return
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['backup-failure'],
              body: `La corrida programada falló.\n\n[Ver log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\nRunbook: \`docs/backups.md\``,
            })
